---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates the TLS certificate for the static website's CloudFront distribution. Must be deployed in us-east-1 region, as CloudFront only accepts ACM certificates from us-east-1."
Parameters:
  DomainName:
    Type: String
  ValidationDomain:
    Type: String
Resources:
  TLSCert: # Look at stack events to see what DNS CNAME to create before the certificate is issued
    Type: AWS::CertificateManager::Certificate
    Description: 'Requests a TLS Certificate from Amazon Certificate Manager'
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          ValidationDomain: !Ref ValidationDomain
      ValidationMethod: 'DNS'
Outputs:
  CertificateArn:
    Description: 'Pass this to the website stack as the CertificateArn parameter'
    Value: !Ref TLSCert
