---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates the TLS certificate for the static website's CloudFront distribution. Must be deployed in us-east-1 region, as CloudFront only accepts ACM certificates from us-east-1."
Parameters:
  DomainName:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 'Route 53 hosted zone for DomainName, used to create the DNS validation record automatically'
Resources:
  TLSCert: # CloudFormation creates the DNS validation CNAME in HostedZoneId and waits for the certificate to be issued
    Type: AWS::CertificateManager::Certificate
    Description: 'Requests a TLS Certificate from Amazon Certificate Manager'
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: 'DNS'
Outputs:
  CertificateArn:
    Description: 'Pass this to the website stack as the CertificateArn parameter'
    Value: !Ref TLSCert
