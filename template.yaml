---
AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates S3 and Cloudfront distribution for a static website. Deploy in ca-central-1 region after the certificate.yaml stack has been deployed in us-east-1."
Parameters:
  DomainName:
    Type: String
  CertificateArn:
    Type: String
    Description: 'ARN of the us-east-1 ACM certificate (CertificateArn output of the certificate.yaml stack)'
Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Description: 'The S3 bucket that contains the static web content'
    Properties:
      BucketName: !Join ['.', ['www', !Ref DomainName]]
      WebsiteConfiguration:
        IndexDocument: 'index.html'
        ErrorDocument: '404.html'
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Description: 'Allows the public to read the contents of S3bucket'
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument: 
        Statement: 
          - Action: 
              - "s3:GetObject"
            Effect: "Allow"
            Resource: !Join ['', ["arn:aws:s3:::", !Ref S3Bucket, "/*"]]
            Principal:
              AWS: !Join [' ', ["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity", !Ref OriginAccessIdentity]]
  OriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Description: 'Limits access to the S3 bucket to only Cloudfront'
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: 'S3Website'
  CDNDistribution: # This resource takes a long time to finish
    Type: AWS::CloudFront::Distribution
    Description: 'Creates a CloudFront Distribution which serves content from S3Bucket'
    DependsOn: OriginAccessIdentity
    Properties:
      DistributionConfig:
        Comment: 'S3Website'
        Aliases:
          - !Ref DomainName
        DefaultRootObject: 'index.html'
        Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: 'sni-only'
        Origins:
          - Id: 'S3Website'
            DomainName: !GetAtt S3Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity:
                Fn::Join:
                  - ''
                  - - 'origin-access-identity/cloudfront/'
                    - Ref: OriginAccessIdentity
        HttpVersion: 'http2' # Forces sni and tls1.2+
        IPV6Enabled: true
        PriceClass: 'PriceClass_100' # EU and NA edge nodes only
        DefaultCacheBehavior:
          TargetOriginId: 'S3Website'
          ViewerProtocolPolicy: 'redirect-to-https'
          ForwardedValues:
            QueryString: false
  Route53ARecordAlias:
    Type: AWS::Route53::RecordSet
    Description: 'Points root of domain to CDN'
    Properties:
      HostedZoneName: !Join ["", [!Ref DomainName, "."]]
      Type: 'A'
      Name: !Ref DomainName
      AliasTarget:
        DNSName: !GetAtt CDNDistribution.DomainName
        HostedZoneId: 'Z2FDTNDATAQYW2'
